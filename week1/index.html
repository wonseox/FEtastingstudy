<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>멜로디 - 간단한 음악 플레이어</title>

  <!-- CSS 파일 연결: style.css 를 같은 폴더에서 불러옵니다 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- header: 서비스 이름 -->
  <header class="header">
    <h1 class="logo">멜로디</h1>
    <p class="slogan">버튼 하나로 바로 듣는 음악</p>
  </header>

  <!-- main: 플레이어와 재생목록 -->
  <main class="main">

    <!-- section 1: 지금 재생 중인 곡 -->
    <section class="player">
      <div class="cover" id="cover"></div>

      <h2 class="song-title" id="title">곡 제목</h2>
      <p class="song-artist" id="artist">아티스트</p>

      <!-- 재생 위치 바 -->
      <div class="progress">
        <span class="time" id="current">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="재생 위치">
        <span class="time" id="duration">0:00</span>
      </div>

      <!-- 이전 / 재생·일시정지 / 다음 -->
      <div class="controls">
        <button class="btn" id="prev" aria-label="이전 곡">⏮</button>
        <button class="btn btn-play" id="play" aria-label="재생">▶</button>
        <button class="btn" id="next" aria-label="다음 곡">⏭</button>
      </div>

      <!-- 볼륨 -->
      <label class="volume">
        <span>볼륨</span>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
      </label>

      <!-- 실제로 소리를 내는 태그 (화면에는 안 보여요) -->
      <audio id="audio"></audio>
    </section>

    <!-- section 2: 재생목록 -->
    <section class="playlist">
      <h2 class="section-title">재생목록</h2>
      <ul class="track-list" id="list"></ul>
    </section>

  </main>

  <!-- footer -->
  <footer class="footer">
    <p>&copy; 2026 멜로디 · HTML, CSS, JavaScript 연습</p>
  </footer>

  <!-- JavaScript 파일 연결: body 맨 아래에 script 태그로 불러옵니다 -->
  <script src="script.js"></script>
</body>
</html>
